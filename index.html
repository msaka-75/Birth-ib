<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Invitation 1 an d'Ibrahim • Célébration Féerique</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,400;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FCF8F2;
      --bg-warm: #F4E6D5;
      --bg-accent: #E5D0B9;
      --kraft-base: #DECAA8;
      --kraft-shadow: #BEA177;
      --kraft-inner: #B8996F;
      --gold-gradient: linear-gradient(135deg, #FFF0B8 0%, #D8B245 42%, #9E7412 100%);
      --gold-border: rgba(224, 185, 95, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 25%, #FFFDFB 0%, var(--bg-cream) 40%, var(--bg-warm) 78%, var(--bg-accent) 100%);
      font-family: 'Quicksand', sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .font-serif-luxury {
      font-family: 'Playfair Display', serif;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .font-script {
      font-family: 'Great Vibes', cursive;
    }

    #sparklesCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 70;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .cloud {
      position: absolute;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.4) 65%, transparent 100%);
      filter: blur(15px);
      border-radius: 50%;
      animation: floatCloud 28s ease-in-out infinite alternate;
    }

    .cloud-1 { width: 520px; height: 190px; top: -50px; left: -110px; }
    .cloud-2 { width: 560px; height: 220px; bottom: -70px; right: -90px; animation-duration: 34s; }
    .cloud-3 { width: 400px; height: 150px; top: 32%; right: -70px; opacity: 0.65; animation-duration: 30s; }
    .cloud-4 { width: 440px; height: 160px; bottom: 16%; left: -80px; opacity: 0.7; animation-duration: 32s; }

    @keyframes floatCloud {
      0% { transform: translateX(0) translateY(0); }
      100% { transform: translateX(45px) translateY(-18px); }
    }

    /* Luminous Golden Crescent Moon */
    .golden-moon-wrap {
      position: absolute;
      top: 38px;
      right: 15%;
      width: 100px;
      height: 100px;
      pointer-events: none;
      z-index: 4;
      animation: moonFloat 8s ease-in-out infinite alternate;
    }

    .golden-moon {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      box-shadow: -15px 12px 0 0 #F3DAAF, -15px 12px 32px 3px rgba(243, 218, 175, 0.55);
      transform: rotate(-18deg);
    }

    .moon-star {
      position: absolute;
      top: 15px;
      right: 4px;
      color: #E6C577;
      font-size: 16px;
      filter: drop-shadow(0 0 6px rgba(255,230,150,0.8));
      animation: starTwinkle 2.5s infinite alternate ease-in-out;
    }

    @keyframes moonFloat {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes starTwinkle {
      0% { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    .bunting-garland-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 105px;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }

    .balloon-bunch {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: balloonGentleFloat 7s ease-in-out infinite alternate;
    }

    .bunch-left { top: 7%; left: 3.5%; }
    .bunch-right { bottom: 5%; right: 3.5%; animation-duration: 8.5s; animation-delay: -3.5s; }

    .balloon-cluster {
      position: relative;
      width: 120px;
      height: 160px;
    }

    .ball {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 44% 44% 56% 56%;
      box-shadow: inset -8px -10px 18px rgba(0,0,0,0.14), inset 6px 8px 12px rgba(255,255,255,0.75), 0 16px 28px rgba(110, 80, 55, 0.18);
    }
    .ball::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 6px solid rgba(130, 95, 65, 0.65);
    }

    .ball-pos-1 { top: 0; left: 10px; width: 75px; height: 95px; background: radial-gradient(circle at 35% 26%, #FFFFFF 0%, #F5E8D9 65%, #DFCDBC 100%); }
    .ball-pos-2 { top: 35px; right: 0; width: 88px; height: 110px; background: radial-gradient(circle at 35% 26%, #FFE8D1 0%, #D4A77E 70%, #9F7146 100%); }
    .ball-pos-3 { top: 60px; left: 0; width: 72px; height: 92px; background: radial-gradient(circle at 35% 26%, #FFF8DE 0%, #E8C166 65%, #B38622 100%); }

    .curled-ribbon {
      width: 1.5px;
      height: 120px;
      background: linear-gradient(to bottom, rgba(160, 125, 95, 0.7), rgba(160, 125, 95, 0.05));
      margin-top: 155px;
      position: relative;
    }
    .curled-ribbon::after {
      content: '🎀';
      position: absolute;
      top: -6px;
      left: -9px;
      font-size: 13px;
    }

    @keyframes balloonGentleFloat {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-22px) rotate(3deg); }
    }

    .teddy-deco {
      position: absolute;
      pointer-events: none;
      z-index: 8;
      filter: drop-shadow(0 10px 20px rgba(95, 65, 35, 0.2));
    }

    /* Teddy Bear 1: Sleeping peacefully on cloud */
    .teddy-moon-cloud {
      top: 40px;
      left: 17%;
      width: 130px;
      height: 110px;
      animation: teddySway 7s ease-in-out infinite alternate;
    }

    /* Teddy Bear 2: Sitting in gift box at bottom left */
    .teddy-gift-box {
      bottom: 18px;
      left: 20px;
      width: 155px;
      height: 165px;
      animation: teddySway 6.5s ease-in-out infinite alternate;
    }

    /* Teddy Bear 3: Peeking from top right with party hat */
    .teddy-party-hat {
      top: 18px;
      right: 22px;
      width: 135px;
      height: 135px;
      animation: teddySway 6s ease-in-out infinite alternate-reverse;
    }

    @keyframes teddySway {
      0% { transform: rotate(-3deg) translateY(0); }
      100% { transform: rotate(3deg) translateY(-8px); }
    }

    .header-container {
      position: relative;
      z-index: 30;
      text-align: center;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 24px;
      pointer-events: auto;
    }

    /* COMPLETELY FADES OUT on open: NEVER overlaps the flyer */
    body.is-opened .header-container {
      opacity: 0;
      transform: translateY(-45px) scale(0.9);
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 25;
      width: 410px;
      height: 290px;
      perspective: 1600px;
      /* Slow cinematic movement for stage lowering */
      transition: transform 1.8s cubic-bezier(0.25, 1, 0.3, 1);
    }

    body.is-opened .stage {
      transform: translateY(115px);
    }

    .envelope-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--kraft-inner);
      border-radius: 16px;
      box-shadow: 0 35px 70px -10px rgba(85, 55, 25, 0.32), 0 12px 28px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    /* Internal Texture Pattern */
    .envelope-inner {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #E5D2B7 0%, #CFB794 100%);
      border-radius: 16px;
      overflow: hidden;
      z-index: 1;
    }

    .envelope-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#B3946F 1.2px, transparent 1.2px);
      background-size: 15px 15px;
      opacity: 0.32;
    }

    /* Top Folded Flap - Slower 1.8s unfold */
    .flap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 205px solid transparent;
      border-right: 205px solid transparent;
      border-top: 165px solid var(--kraft-base);
      transform-origin: top center;
      /* Slower and luxurious opening easing */
      transition: transform 1.75s cubic-bezier(0.35, 0.05, 0.2, 1), z-index 0.3s 0.6s;
      z-index: 9;
      filter: drop-shadow(0 6px 9px rgba(80, 50, 20, 0.18));
    }

    /* Side Flaps */
    .flap-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 145px solid transparent;
      border-bottom: 145px solid transparent;
      border-left: 215px solid #D6BF9A;
      z-index: 6;
      border-top-left-radius: 16px;
      border-bottom-left-radius: 16px;
    }

    .flap-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 145px solid transparent;
      border-bottom: 145px solid transparent;
      border-right: 215px solid #CDB58E;
      z-index: 6;
      border-top-right-radius: 16px;
      border-bottom-right-radius: 16px;
    }

    /* Front Bottom Pocket */
    .flap-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 205px solid transparent;
      border-right: 205px solid transparent;
      border-bottom: 175px solid #C3A980;
      z-index: 7;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      filter: drop-shadow(0 -3px 8px rgba(70, 45, 15, 0.08));
    }

    /* Wax Seal Button with Teddy Paw Stamp */
    .wax-seal {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      background: var(--gold-gradient);
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(85, 55, 15, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.75), inset 0 -3px 6px rgba(100, 65, 10, 0.5);
      border: 3px solid rgba(255, 245, 215, 0.45);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
      cursor: pointer;
      animation: sealGlowPulse 2.8s infinite ease-in-out;
    }

    @keyframes sealGlowPulse {
      0%, 100% {
        box-shadow: 0 10px 28px rgba(85, 55, 15, 0.45), 0 0 0 0 rgba(220, 180, 105, 0.7);
      }
      50% {
        box-shadow: 0 14px 34px rgba(85, 55, 15, 0.6), 0 0 0 15px rgba(220, 180, 105, 0);
      }
    }

    .wax-seal:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .card-slot {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(35px) scale(0.85);
      width: 345px;
      height: 490px;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      /* Slower and majestic gliding: 2.1s with gentle delay */
      transition: transform 2.1s cubic-bezier(0.2, 0.9, 0.25, 1) 0.35s, 
                  opacity 1s ease 0.2s, 
                  box-shadow 2.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 28px 70px rgba(60, 40, 15, 0.42);
      background: #FFFDFB;
      display: block;
    }

    /* OPENED STATE: Slow unfolding and card ascent */
    body.is-opened .flap-top {
      transform: rotateX(180deg);
      z-index: 2;
    }

    body.is-opened .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.15);
      pointer-events: none;
    }

    body.is-opened .card-slot {
      opacity: 1;
      pointer-events: auto;
      z-index: 50; /* Above all envelope layers */
      transform: translateX(-50%) translateY(-275px) scale(1.18);
    }

    .bottom-bar {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      pointer-events: none;
      z-index: 75;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
    }

    body.is-opened .bottom-bar {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 520px) {
      .stage {
        width: 325px;
        height: 235px;
      }
      body.is-opened .stage {
        transform: translateY(95px);
      }
      .flap-top {
        border-left-width: 162px;
        border-right-width: 162px;
        border-top-width: 135px;
      }
      .flap-left { border-left-width: 172px; border-top-width: 118px; border-bottom-width: 118px; }
      .flap-right { border-right-width: 172px; border-top-width: 118px; border-bottom-width: 118px; }
      .flap-bottom {
        border-left-width: 162px;
        border-right-width: 162px;
        border-bottom-width: 145px;
      }
      .wax-seal {
        top: 118px;
        width: 60px;
        height: 60px;
      }
      .card-slot {
        width: 295px;
        height: 420px;
      }
      body.is-opened .card-slot {
        transform: translateX(-50%) translateY(-210px) scale(1.1);
      }
      .bunch-left { left: -10px; top: 7%; }
      .bunch-right { right: -10px; bottom: 4%; }
      .teddy-moon-cloud { display: none; }
      .teddy-gift-box { width: 115px; height: 125px; left: 8px; bottom: 8px; }
      .teddy-party-hat { width: 100px; height: 100px; right: 8px; top: 12px; }
      .golden-moon-wrap { width: 75px; height: 75px; right: 8%; top: 32px; }
      .golden-moon { width: 68px; height: 68px; }
    }
  </style>
</head>

<body>
  <canvas id="sparklesCanvas"></canvas>

  <!-- Hanging Dual Festive Bunting Garland with Teddy Badges -->
  <div class="bunting-garland-wrap">
    <svg class="w-full h-full" viewBox="0 0 1200 95" preserveAspectRatio="none" fill="none">
      <!-- Upper Rope -->
      <path d="M 0,15 Q 300,50 600,18 Q 900,50 1200,15" stroke="#9A7753" stroke-width="1.8" stroke-dasharray="4 3"/>
      <!-- Lower Rope -->
      <path d="M 0,35 Q 300,75 600,38 Q 900,75 1200,35" stroke="#B8946E" stroke-width="1.4" opacity="0.75"/>

      <!-- Upper Pennants with warm beige & golden palette -->
      <polygon points="50,20 78,58 106,22" fill="#D9BA9B" />
      <polygon points="140,26 168,66 196,28" fill="#EAD9C6" />
      <polygon points="230,32 258,70 286,34" fill="#D4AF37" />
      <polygon points="320,35 348,72 376,35" fill="#C9A37A" />
      <polygon points="410,32 438,69 466,30" fill="#F4E6D4" />
      <polygon points="500,22 528,62 556,24" fill="#D9BA9B" />
      <polygon points="590,20 618,58 646,22" fill="#D4AF37" />
      <polygon points="680,26 708,66 736,28" fill="#EAD9C6" />
      <polygon points="770,32 798,71 826,34" fill="#C9A37A" />
      <polygon points="860,35 888,72 916,33" fill="#D4AF37" />
      <polygon points="950,30 978,67 1006,27" fill="#F4E6D4" />
      <polygon points="1040,24 1068,60 1096,22" fill="#D9BA9B" />
      <polygon points="1130,18 1158,54 1186,16" fill="#D4AF37" />

      <!-- Hanging Mini Stars -->
      <circle cx="168" cy="74" r="3" fill="#D4AF37" />
      <circle cx="348" cy="80" r="3.5" fill="#E8C166" />
      <circle cx="528" cy="70" r="3" fill="#D4AF37" />
      <circle cx="708" cy="74" r="3" fill="#E8C166" />
      <circle cx="888" cy="80" r="3.5" fill="#D4AF37" />
      <circle cx="1068" cy="68" r="3" fill="#E8C166" />
    </svg>
  </div>

  <div class="cloud-layer">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
  </div>

  <div class="golden-moon-wrap">
    <div class="golden-moon"></div>
    <span class="moon-star">✦</span>
    <span class="moon-star" style="top:48px; right:20px; font-size:12px; animation-delay:1.2s;">✨</span>
  </div>

  <!-- Left Balloon Bouquet -->
  <div class="balloon-bunch bunch-left">
    <div class="balloon-cluster">
      <div class="ball ball-pos-1"></div>
      <div class="ball ball-pos-2"></div>
      <div class="ball ball-pos-3"></div>
    </div>
    <div class="curled-ribbon"></div>
  </div>

  <!-- Right Balloon Bouquet -->
  <div class="balloon-bunch bunch-right">
    <div class="balloon-cluster">
      <div class="ball ball-pos-2" style="left:0; right:auto;"></div>
      <div class="ball ball-pos-1" style="left:35px;"></div>
      <div class="ball ball-pos-3" style="left:15px;"></div>
    </div>
    <div class="curled-ribbon"></div>
  </div>

  <!-- Teddy Bear Top Left: Resting on a cute cloud holding golden balloon '1' -->
  <div class="teddy-deco teddy-moon-cloud">
    <svg viewBox="0 0 140 120" class="w-full h-full">
      <!-- Fluffy Cloud -->
      <path d="M 20 85 Q 10 85 10 70 Q 10 55 25 55 Q 30 40 45 42 Q 60 30 80 40 Q 95 32 105 45 Q 120 48 120 65 Q 120 85 100 85 Z" fill="rgba(255,255,255,0.92)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
      
      <!-- Mini Teddy Sitting -->
      <ellipse cx="65" cy="58" rx="18" ry="16" fill="#C1976F"/>
      <ellipse cx="65" cy="60" rx="9" ry="8" fill="#F4E8D8"/>
      <!-- Paws -->
      <circle cx="50" cy="64" r="6" fill="#B38963"/>
      <circle cx="80" cy="64" r="6" fill="#B38963"/>
      <!-- Ears -->
      <circle cx="52" cy="34" r="7.5" fill="#C1976F"/>
      <circle cx="52" cy="34" r="4" fill="#EAD5C2"/>
      <circle cx="78" cy="34" r="7.5" fill="#C1976F"/>
      <circle cx="78" cy="34" r="4" fill="#EAD5C2"/>
      <!-- Head -->
      <circle cx="65" cy="42" r="16" fill="#C1976F"/>
      <ellipse cx="65" cy="45" rx="7" ry="5.5" fill="#F8EFE4"/>
      <ellipse cx="65" cy="43" rx="2.5" ry="1.8" fill="#442E1B"/>
      <!-- Eyes & Cheeks -->
      <circle cx="59" cy="39" r="2" fill="#3D2817"/>
      <circle cx="71" cy="39" r="2" fill="#3D2817"/>
      <ellipse cx="54" cy="44" rx="2.5" ry="1.5" fill="#F0AA98" opacity="0.6"/>
      <ellipse cx="76" cy="44" rx="2.5" ry="1.5" fill="#F0AA98" opacity="0.6"/>
      <!-- Golden Balloon 1 string -->
      <path d="M 80 60 Q 95 45 105 30" stroke="#C3A06B" stroke-width="1.2" fill="none"/>
      <circle cx="105" cy="22" r="11" fill="url(#goldBalloonGrad)" stroke="#B38622" stroke-width="0.8"/>
      <text x="105" y="27" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#583A0E" text-anchor="middle">1</text>
      
      <defs>
        <radialGradient id="goldBalloonGrad" cx="35%" cy="30%">
          <stop offset="0%" stop-color="#FFFBEB"/>
          <stop offset="65%" stop-color="#E8C166"/>
          <stop offset="100%" stop-color="#B88A22"/>
        </radialGradient>
      </defs>
    </svg>
  </div>

  <!-- Teddy Bear Bottom Left: In luxury gift box with ribbon bow -->
  <div class="teddy-deco teddy-gift-box">
    <svg viewBox="0 0 140 150" class="w-full h-full">
      <!-- Gift Box Base -->
      <rect x="25" y="75" width="85" height="65" rx="7" fill="#FDF8F0" stroke="#DFCFBB" stroke-width="2"/>
      <!-- Golden Ribbons on Box -->
      <rect x="62" y="75" width="12" height="65" fill="#D4AF37"/>
      
      <!-- Teddy emerging from Box -->
      <ellipse cx="68" cy="55" rx="30" ry="26" fill="#C1976F" stroke="#A97E57" stroke-width="2"/>
      <ellipse cx="68" cy="58" rx="15" ry="13" fill="#F6ECE0"/>
      <!-- Raised Paws -->
      <ellipse cx="38" cy="56" rx="9" ry="8" fill="#B38963" transform="rotate(-25 38 56)"/>
      <circle cx="38" cy="56" r="3.5" fill="#EAD5C2"/>
      <ellipse cx="98" cy="56" rx="9" ry="8" fill="#B38963" transform="rotate(25 98 56)"/>
      <circle cx="98" cy="56" r="3.5" fill="#EAD5C2"/>
      <!-- Ears -->
      <circle cx="45" cy="22" r="13" fill="#C1976F" stroke="#A97E57" stroke-width="1.8"/>
      <circle cx="45" cy="22" r="7" fill="#EAD5C2"/>
      <circle cx="91" cy="22" r="13" fill="#C1976F" stroke="#A97E57" stroke-width="1.8"/>
      <circle cx="91" cy="22" r="7" fill="#EAD5C2"/>
      <!-- Head -->
      <circle cx="68" cy="36" r="28" fill="#C1976F" stroke="#A97E57" stroke-width="2"/>
      <ellipse cx="68" cy="42" rx="13" ry="10" fill="#F8EFE4"/>
      <ellipse cx="68" cy="38" rx="4.5" ry="3" fill="#442E1B"/>

  <!-- Teddy Bear Top Right: Party Hat & Bow Tie -->

  <main class="stage">
    <div class="envelope-box" id="envelopeWrapper" onclick="toggleEnvelope()">
      
      <!-- Kraft Interior Pattern -->
      <div class="envelope-inner"></div>

      <!-- Top Flap (Animated with slow 1.75s 3D rotation) -->

      <div class="flap-left"></div>

    <button onclick="toggleEnvelope()" class="px-6 py-2.5 rounded-full bg-stone-900/85 hover:bg-stone-900 text-white backdrop-blur-md shadow-2xl border border-white/25 font-semibold text-xs tracking-wider uppercase transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2">
      <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
      <span>Refermer l'enveloppe</span>
    </button>
  </div>

  <script>
    let isOpened = false;
    const body = document.body;
    const canvas = document.getElementById('sparklesCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    // Responsive Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Sweet Music Box Chime melody using Web Audio API
    function playChimeMelody() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const actx = new AudioContext();
        if (actx.state === 'suspended') actx.resume();

        // Harmonious crystal notes matching the slower graceful pace: C5, E5, G5, B5, C6, E6
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = actx.createOscillator();
          const gain = actx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, actx.currentTime + idx * 0.18);

          gain.gain.setValueAtTime(0.08, actx.currentTime + idx * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + idx * 0.18 + 1.4);

          osc.connect(gain);
          gain.connect(actx.destination);

          osc.start(actx.currentTime + idx * 0.18);
          osc.stop(actx.currentTime + idx * 0.18 + 1.4);
        });
      } catch (e) {
        console.warn('Audio note could not be played', e);
      }
    }

    // Festive Confetti & Golden Sparkles Burst
    function triggerCelebrationParticles(originX, originY) {
      const colors = ['#FFE8A3', '#D4AF37', '#FFF7D6', '#F5D38A', '#E8C18E', '#FFFFFF'];
      for (let i = 0; i < 85; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 1.5;
        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.8,
          radius: Math.random() * 3.8 + 1.2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.012 + 0.008
        });
      }
    }

    // Gentle ambient twinkling stars
    const ambientStars = Array.from({ length: 40 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2 + 0.8,
      alpha: Math.random(),
      speed: Math.random() * 0.018 + 0.005
    }));

    function particleLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ambient Twinkle
      ambientStars.forEach(s => {
        s.alpha += s.speed;
        const currentAlpha = (Math.sin(s.alpha) + 1) / 2 * 0.7;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 235, 175, ${currentAlpha})`;
        ctx.fill();
      });

      // Confetti & Sparkles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.09; // Light gravity
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#FFE8A3';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      requestAnimationFrame(particleLoop);
    }
    particleLoop();

    // Toggle Opening & Closing
    function toggleEnvelope() {
      const seal = document.getElementById('waxSeal');
      const rect = seal.getBoundingClientRect();

      isOpened = !isOpened;
      if (isOpened) {
        body.classList.add('is-opened');
        playChimeMelody();
        triggerCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
      } else {
        body.classList.remove('is-opened');
      }
    }
  </script>
