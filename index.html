<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Invitation 1 an Ibrahim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fbf5ee;
      --bg-warm: #ebd5bf;
      --env-base: #dfcba8;
      --env-dark: #cbb288;
      --env-pocket: #be9f72;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #d4af37 40%, #aa8014 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #fffdfa 0%, var(--bg-cream) 55%, var(--bg-warm) 100%);
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      perspective: 1400px;
      position: relative;
    }

    /* === TOILE DE PAILLETTES & PARTICULES === */
    #sparklesCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    /* === AMBIANCE CIEL, LUNE ET NUAGES === */
    .sky-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Croissant de lune féerique */
    .moon {
      position: absolute;
      top: 6%;
      right: 18%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: -15px 12px 0 0 #f5dfb8, -15px 12px 30px 2px rgba(245, 223, 184, 0.4);
      transform: rotate(-15deg);
      animation: moonFloat 8s ease-in-out infinite alternate;
    }

    @keyframes moonFloat {
      0% { transform: rotate(-15deg) translateY(0); }
      100% { transform: rotate(-10deg) translateY(-12px); }
    }

    .cloud {
      position: absolute;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.4) 65%, transparent 100%);
      filter: blur(14px);
      border-radius: 50%;
    }
    .c1 { width: 450px; height: 180px; top: -30px; left: -100px; }
    .c2 { width: 500px; height: 220px; bottom: -50px; right: -80px; }
    .c3 { width: 340px; height: 130px; top: 30%; right: -50px; opacity: 0.7; }
    .c4 { width: 380px; height: 160px; bottom: 15%; left: -60px; opacity: 0.6; }

    /* === GRAPPES DE BALLONS AVEC FICELLES === */
    .balloon-group {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: balloonFloat 6s ease-in-out infinite alternate;
    }

    .group-left { top: 8%; left: 5%; }
    .group-right { bottom: 8%; right: 5%; animation-duration: 7.5s; animation-delay: -2s; }

    .balloon {
      border-radius: 50% 50% 50% 50% / 44% 44% 56% 56%;
      box-shadow: inset -6px -8px 16px rgba(0,0,0,0.1), 0 12px 24px rgba(120, 95, 75, 0.16);
      position: relative;
    }
    .balloon::before {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 6px solid rgba(130, 100, 75, 0.6);
    }
    .string {
      width: 1.5px;
      height: 90px;
      background: linear-gradient(to bottom, rgba(160, 130, 105, 0.5), transparent);
      margin-top: 5px;
    }

    .b-ivory { width: 75px; height: 95px; background: radial-gradient(circle at 35% 28%, #ffffff, #f0e2d3 70%, #d8c2af); }
    .b-caramel { width: 90px; height: 112px; background: radial-gradient(circle at 35% 28%, #f7dfc8, #cfa882 70%, #a87e56); margin-top: -30px; }
    .b-gold { width: 68px; height: 86px; background: radial-gradient(circle at 35% 28%, #fff1c7, #e3be69 70%, #b88a29); margin-top: -25px; }

    @keyframes balloonFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-18px) rotate(2.5deg); }
    }

    /* === OURSONS DÉCORATIFS === */
    .teddy-corner {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    .teddy-bl { bottom: 20px; left: 25px; width: 140px; height: 140px; animation: gentleSway 5s ease-in-out infinite alternate; }
    .teddy-tr { top: 25px; right: 25px; width: 125px; height: 125px; animation: gentleSway 6s ease-in-out infinite alternate-reverse; }

    @keyframes gentleSway {
      0% { transform: rotate(-2deg) scale(1); }
      100% { transform: rotate(3deg) scale(1.03); }
    }

    /* === TITRE ET INSTRUCTION === */
    .header-box {
      text-align: center;
      z-index: 20;
      margin-bottom: 25px;
      transition: opacity 0.5s ease;
    }

    .header-box h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.65rem;
      letter-spacing: 4px;
      color: #6d4b27;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
      margin-bottom: 6px;
    }

    .header-box p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #937048;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    /* === SCÈNE DE L'ENVELOPPE === */
    .stage {
      position: relative;
      z-index: 10;
      width: 380px;
      height: 270px;
      margin-top: 10px;
    }

    .envelope-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Fond intérieur de l'enveloppe */
    .envelope-back {
      position: absolute;
      inset: 0;
      background: #bfa37a;
      border-radius: 12px;
      box-shadow: 0 30px 60px var(--env-shadow);
      z-index: 1;
    }

    /* Rabat supérieur pivotant */
    .flap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 190px solid transparent;
      border-right: 190px solid transparent;
      border-top: 155px solid var(--env-base);
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 7;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    }

    /* Rabats latéraux */
    .flap-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 135px solid transparent;
      border-bottom: 135px solid transparent;
      border-left: 200px solid #d5bd96;
      z-index: 5;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .flap-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 135px solid transparent;
      border-bottom: 135px solid transparent;
      border-right: 200px solid #ceb58c;
      z-index: 5;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    /* Rabat inférieur formant la poche avant */
    .flap-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 190px solid transparent;
      border-right: 190px solid transparent;
      border-bottom: 165px solid #c2a77c;
      z-index: 6;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      filter: drop-shadow(0 -2px 6px rgba(0,0,0,0.06));
    }

    /* Sceau doré de cire */
    .wax-seal {
      position: absolute;
      top: 135px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 66px;
      height: 66px;
      background: var(--gold-gradient);
      border-radius: 50%;
      box-shadow: 0 10px 22px rgba(80, 50, 15, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s ease, opacity 0.45s ease;
      border: 3px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }

    .wax-seal svg {
      width: 36px;
      height: 36px;
      fill: #4e3209;
      filter: drop-shadow(0 1px 1px rgba(255,255,255,0.4));
    }

    /* === CONTENEUR DU FLYER (TOTALEMENT CACHÉ AU DÉPART) === */
    .card-slot {
      position: absolute;
      top: 10px;
      left: 20px;
      width: 340px;
      height: 480px;
      z-index: 3; /* Derrière les rabats fermés */
      opacity: 0;
      pointer-events: none;
      transform: translateY(40px) scale(0.85);
      transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease, z-index 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(70, 45, 20, 0.35);
      background: transparent;
      display: block;
    }

    /* === OUVERTURE === */
    .envelope-wrapper.open .flap-top {
      transform: rotateX(180deg);
      z-index: 2; /* Passe derrière la carte quand elle sort */
    }

    .envelope-wrapper.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
    }

    .envelope-wrapper.open .card-slot {
      opacity: 1;
      pointer-events: auto;
      z-index: 30; /* Passe au premier plan absolu */
      transform: translateY(-220px) scale(1.15);
    }

    /* Adaptation Mobile / Petit écran */
    @media (max-width: 480px) {
      .stage {
        width: 320px;
        height: 230px;
        margin-top: 30px;
      }
      .flap-top {
        border-left-width: 160px;
        border-right-width: 160px;
        border-top-width: 130px;
      }
      .flap-left { border-left-width: 170px; border-top-width: 115px; border-bottom-width: 115px; }
      .flap-right { border-right-width: 170px; border-top-width: 115px; border-bottom-width: 115px; }
      .flap-bottom {
        border-left-width: 160px;
        border-right-width: 160px;
        border-bottom-width: 140px;
      }
      .wax-seal { top: 115px; width: 58px; height: 58px; }
      .wax-seal svg { width: 30px; height: 30px; }
      .card-slot {
        left: 10px;
        width: 300px;
        height: 420px;
      }
      .envelope-wrapper.open .card-slot {
        transform: translateY(-185px) scale(1.12);
      }
      .teddy-bl { width: 100px; height: 100px; left: 10px; bottom: 10px; }
      .teddy-tr { width: 95px; height: 95px; right: 10px; top: 15px; }
      .group-left { left: -5px; }
      .group-right { right: -5px; }
    }
  </style>
</head>
<body>

  <!-- Toile canvas pour étincelles et étoiles dorées -->
  <canvas id="sparklesCanvas"></canvas>

  <!-- Décor céleste (Lune & Nuages) -->
  <div class="sky-decor">
    <div class="moon"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
  </div>

  <!-- Ballons gauches avec ficelles -->
  <div class="balloon-group group-left">
    <div class="balloon b-ivory"></div>
    <div class="balloon b-caramel"></div>
    <div class="balloon b-gold"></div>
    <div class="string"></div>
  </div>

  <!-- Ballons droits avec ficelles -->
  <div class="balloon-group group-right">
    <div class="balloon b-gold"></div>
    <div class="balloon b-ivory"></div>
    <div class="balloon b-caramel"></div>
    <div class="string"></div>
  </div>

  <!-- Ourson bas gauche -->
  <svg class="teddy-corner teddy-bl" viewBox="0 0 100 100">
    <circle cx="28" cy="28" r="14" fill="#c49a6c" stroke="#aa8055" stroke-width="2"/>
    <circle cx="28" cy="28" r="8" fill="#ecd4bc"/>
    <circle cx="72" cy="28" r="14" fill="#c49a6c" stroke="#aa8055" stroke-width="2"/>
    <circle cx="72" cy="28" r="8" fill="#ecd4bc"/>
    <ellipse cx="50" cy="50" rx="33" ry="29" fill="#c49a6c" stroke="#aa8055" stroke-width="2"/>
    <ellipse cx="50" cy="57" rx="17" ry="13" fill="#faefe4"/>
    <ellipse cx="50" cy="52" rx="5.5" ry="4" fill="#46311c"/>
    <path d="M 50 56 Q 46 62 44 60 M 50 56 Q 54 62 56 60" stroke="#46311c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="39" cy="44" r="3.8" fill="#46311c"/>
    <circle cx="61" cy="44" r="3.8" fill="#46311c"/>
    <circle cx="40.5" cy="42.5" r="1.3" fill="#ffffff"/>
    <circle cx="62.5" cy="42.5" r="1.3" fill="#ffffff"/>
    <ellipse cx="32" cy="53" rx="4" ry="2.2" fill="#f2af9d" opacity="0.6"/>
    <ellipse cx="68" cy="53" rx="4" ry="2.2" fill="#f2af9d" opacity="0.6"/>
  </svg>

  <!-- Ourson haut droit avec nœud papillon -->
  <svg class="teddy-corner teddy-tr" viewBox="0 0 100 100">
    <circle cx="28" cy="28" r="14" fill="#c49a6c"/>
    <circle cx="28" cy="28" r="8" fill="#ecd4bc"/>
    <circle cx="72" cy="28" r="14" fill="#c49a6c"/>
    <circle cx="72" cy="28" r="8" fill="#ecd4bc"/>
    <ellipse cx="50" cy="50" rx="31" ry="27" fill="#c49a6c"/>
    <ellipse cx="50" cy="56" rx="15" ry="11" fill="#faefe4"/>
    <ellipse cx="50" cy="51.5" rx="5" ry="3.5" fill="#46311c"/>
    <circle cx="40" cy="45" r="3.4" fill="#46311c"/>
    <circle cx="60" cy="45" r="3.4" fill="#46311c"/>
    <circle cx="41.2" cy="43.8" r="1.2" fill="#fff"/>
    <circle cx="61.2" cy="43.8" r="1.2" fill="#fff"/>
    <polygon points="41,73 50,76 41,79" fill="#b0865d"/>
    <polygon points="59,73 50,76 59,79" fill="#b0865d"/>
    <circle cx="50" cy="76" r="3" fill="#946b43"/>
  </svg>

  <!-- Titre et consigne -->
  <div class="header-box" id="headerBox">
    <h1>Ibrahim fête ses 1 an</h1>
    <p id="hint">Appuyez sur le sceau pour ouvrir l'invitation</p>
  </div>

  <!-- Scène de l'enveloppe -->
  <div class="stage">
    <div class="envelope-wrapper" id="envelopeWrapper">
      <!-- Fond arrière -->
      <div class="envelope-back"></div>

      <!-- Rabat supérieur -->
      <div class="flap-top"></div>

      <!-- Rabats de fermeture (qui cachent la carte) -->
      <div class="flap-left"></div>
      <div class="flap-right"></div>
      <div class="flap-bottom"></div>

      <!-- Sceau de cire doré (patte d'ourson) -->
      <div class="wax-seal" title="Ouvrir">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="15" r="4.5" />
          <circle cx="6.5" cy="10" r="2.2" />
          <circle cx="17.5" cy="10" r="2.2" />
          <circle cx="9" cy="6" r="2" />
          <circle cx="15" cy="6" r="2" />
        </svg>
      </div>

      <!-- VOTRE IMAGE (invitation.png - Cachée à 100% au départ) -->
      <div class="card-slot">
        <img src="invitation.png" alt="Flyer Invitation Ibrahim" />
      </div>
    </div>
  </div>

  <script>
    const wrapper = document.getElementById('envelopeWrapper');
    const hint = document.getElementById('hint');
    const canvas = document.getElementById('sparklesCanvas');
    const ctx = canvas.getContext('2d');

    // Synthèse sonore féerique (boîte à musique magique)
    function playChimeSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const actx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // Do, Mi, Sol, Do aigu
        notes.forEach((freq, idx) => {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, actx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.08, actx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + idx * 0.12 + 0.9);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start(actx.currentTime + idx * 0.12);
          osc.stop(actx.currentTime + idx * 0.12 + 0.9);
        });
      } catch (e) {}
    }

    // Gestion de la pluie de paillettes et d'étoiles
    let sparkles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerBurst(x, y) {
      for (let i = 0; i < 55; i++) {
        sparkles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.7) * 10,
          radius: Math.random() * 3.5 + 1.2,
          color: `hsl(${Math.random() * 25 + 40}, 90%, ${Math.random() * 20 + 65}%)`,
          alpha: 1,
          decay: Math.random() * 0.018 + 0.012
        });
      }
    }

    // Étoiles scintillantes douces permanentes en arrière-plan
    let ambientStars = Array.from({ length: 30 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2 + 0.8,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.008
    }));

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Scintillement d'ambiance
      ambientStars.forEach(s => {
        s.alpha += s.speed;
        const currentAlpha = (Math.sin(s.alpha) + 1) / 2 * 0.7;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 230, 160, ${currentAlpha})`;
        ctx.fill();
      });

      // Explosion de paillettes au clic
      sparkles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          sparkles.splice(index, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#ffeaa7';
          ctx.fill();
          ctx.restore();
        }
      });

      requestAnimationFrame(loop);
    }
    loop();

    // Clic pour ouvrir / refermer
    wrapper.addEventListener('click', () => {
      const isOpen = wrapper.classList.toggle('open');
      const rect = wrapper.getBoundingClientRect();

      if (isOpen) {
        playChimeSound();
        triggerBurst(rect.left + rect.width / 2, rect.top + 130);
        hint.textContent = "Touchez l'invitation pour refermer";
      } else {
        hint.textContent = "Appuyez sur le sceau pour ouvrir l'invitation";
      }
    });
  </script>
</body>
</html>
